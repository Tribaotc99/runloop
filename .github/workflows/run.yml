name: runloop
on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'so phut chay'
        default: '335'
      direct:
        description: '1 = khong proxy'
        default: '0'
      maxacc:
        description: 'so acc toi da (0 = tat ca)'
        default: '0'
concurrency:
  group: runloop
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: deps
        run: npm install --omit=dev --no-audit --no-fund
      - name: run
        env:
          WALLETS: ${{ secrets.WALLETS }}
          TP_KEYS: ${{ secrets.TP_KEYS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BUDGET_MIN: ${{ inputs.budget || '335' }}
          DIRECT: ${{ inputs.direct || '0' }}
          MAXACC: ${{ inputs.maxacc || '0' }}
          GAP_MS: '260'
        run: node runner.mjs
